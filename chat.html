<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP2 Chat Updater</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f232c;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8a93a3;
    --accent: #4f8cff;
    --accent-2: #6ba1ff;
    --good: #34c77a;
    --warn: #f5a524;
    --bad: #ef5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
  }
  /* ---------- Auth gate (handled by cloud-sync.js — styles live there) ---------- */

  /* ---------- App layout ---------- */
  #app { display: none; flex-direction: column; height: 100vh; }
  #app.ready { display: flex; }
  header {
    display: flex; align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    gap: 12px;
  }
  .h-title { font-size: 16px; font-weight: 600; }
  .h-sub { color: var(--muted); font-size: 12px; }
  .h-spacer { flex: 1; }
  .h-link {
    color: var(--muted); font-size: 12px;
    text-decoration: none; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .h-link:hover { color: var(--text); border-color: var(--accent); }

  /* ---------- Messages ---------- */
  #msgs {
    flex: 1; overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .msg.error {
    align-self: flex-start;
    background: rgba(239, 90, 90, 0.12);
    border: 1px solid rgba(239, 90, 90, 0.3);
    color: #ffb3b3;
  }

  /* Preview card */
  .preview {
    align-self: flex-start;
    width: 86%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    border-bottom-left-radius: 4px;
  }
  .preview-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    font-weight: 600; font-size: 14px;
  }
  .preview-body { padding: 12px 16px; font-size: 13px; }
  .preview-section { margin: 6px 0; }
  .preview-section h4 {
    margin: 4px 0 4px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .diff-row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 4px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .diff-row:last-child { border-bottom: none; }
  .diff-key { color: var(--accent-2); min-width: 110px; }
  .diff-change { color: var(--text); flex: 1; }
  .diff-old { color: var(--muted); text-decoration: line-through; }
  .diff-arrow { color: var(--muted); }
  .diff-new { color: var(--good); }
  .preview-actions {
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .btn {
    padding: 7px 14px;
    border: none; border-radius: 6px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .btn-confirm { background: var(--good); color: white; }
  .btn-confirm:hover { filter: brightness(1.1); }
  .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-cancel:hover { color: var(--text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Loader */
  .loader {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Composer ---------- */
  #composer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 16px;
  }
  #composer-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 8px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.45;
    resize: none;
    max-height: 140px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: white;
    border: none; border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
  }
  #send:hover { background: var(--accent-2); }
  #send:disabled { opacity: .4; cursor: not-allowed; }

  #hints {
    max-width: 760px; margin: 6px auto 0;
    font-size: 11px; color: var(--muted);
    text-align: center;
  }
  /* Header role badge */
  .role-badge {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .role-badge.editor { background: rgba(52, 199, 122, 0.15); color: var(--good); }
  .role-badge.viewer { background: rgba(245, 165, 36, 0.15); color: var(--warn); }

  /* Read-only notice inside preview */
  .readonly-note {
    flex: 1; font-size: 12px; color: var(--warn);
    display: flex; align-items: center; gap: 6px;
  }
</style>
</head>
<body>

<!-- Auth gate is provided by cloud-sync.js (#cs-auth-gate) for a unified login UX with the main tracker. -->

<!-- App -->
<div id="app">
  <header>
    <div>
      <div class="h-title">CP2 Chat Updater</div>
      <div class="h-sub" id="user-label">—</div>
    </div>
    <div class="h-spacer"></div>
    <span class="role-badge" id="role-badge" style="display:none"></span>
    <a class="h-link" href="index.html" title="Back to main tracker">📋 Tracker</a>
    <a class="h-link" href="#" id="logout">Sign out</a>
  </header>

  <div id="msgs"></div>

  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" rows="1" placeholder="e.g.: Installed SF11A and SF11B framing today, 11A.2 had an issue …"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="hints">
      <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for newline · You'll preview before changes are saved
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- Shared auth gate + cloud sync (provides #cs-auth-gate login UI with Forgot password) -->
<script src="cloud-sync.js"></script>

<script>
/* ============================================================
   CP2 Chat — main script
   ============================================================ */
(() => {
  const $ = (id) => document.getElementById(id);

  // ---------- State ----------
  let currentUser = null;
  let cachedState = null;   // last snapshot loaded from /state
  let pendingPreview = null; // currently shown preview {parsed, msgEl}
  let isEditor = false;     // whether the current user is in /allowlist

  // ---------- Firebase init via shared CloudSync (gives us the unified auth gate with Forgot password) ----------
  CloudSync.init(window.FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.database();

  // ---------- Auth ----------
  $('logout').addEventListener('click', (e) => {
    e.preventDefault();
    auth.signOut();
  });

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      $('user-label').textContent = user.email;
      $('app').classList.add('ready');
      await checkEditorStatus();
      await loadState();
      // Subscribe to state changes so multi-tab edits keep us fresh
      db.ref('state').on('value', (snap) => {
        const v = snap.val();
        if (v) cachedState = v;
      });
      const roleLabel = isEditor ? 'editor' : 'view-only';
      pushSystem(`Signed in as ${user.email.split('@')[0]} (${roleLabel}) · loaded ${cachedState?.units?.length || 0} units`);
      if (isEditor) {
        pushBot('Hi! Tell me what was installed today. I\'ll parse it, show a preview, and only write to the database after you confirm.\n\nExamples:\n• "Installed framing for SF11A and SF11B today"\n• "SF12A.3 had an issue — wrong cutout"\n• "Added louver to 20A.1"\n• "Planning to install the SF03 row tomorrow"');
      } else {
        pushBot('Hi! You\'re signed in as **view only** — ask me anything about the current install state and I\'ll answer, but I can\'t save changes from your account. To save changes, ask an admin to add your email to the editor allowlist.\n\nExamples:\n• "What\'s the status of SF20A?"\n• "List all units with issues"\n• "How many framings are installed in the North zone?"');
      }
    } else {
      currentUser = null;
      cachedState = null;
      isEditor = false;
      updateRoleBadge();
      $('app').classList.remove('ready');
    }
  });

  async function checkEditorStatus() {
    isEditor = false;
    try {
      const emailKey = currentUser.email.replace(/\./g, ',');
      const snap = await db.ref('allowlist/' + emailKey).once('value');
      isEditor = snap.exists();
    } catch (err) {
      // If we can't even read our own allowlist entry, treat as non-editor.
      console.warn('Allowlist check failed:', err);
      isEditor = false;
    }
    updateRoleBadge();
  }

  function updateRoleBadge() {
    const b = $('role-badge');
    if (!currentUser) { b.style.display = 'none'; return; }
    b.style.display = '';
    if (isEditor) {
      b.textContent = 'Editor';
      b.className = 'role-badge editor';
    } else {
      b.textContent = 'View only';
      b.className = 'role-badge viewer';
    }
  }

  async function loadState() {
    try {
      const snap = await db.ref('state').once('value');
      cachedState = snap.val();
      if (!cachedState || !cachedState.units) {
        pushError('Database has no state yet — open the main tracker once to initialize it.');
      }
    } catch (err) {
      pushError('Failed to load data: ' + (err.message || err));
    }
  }

  function humanAuthError(err) {
    // Auth errors surface in the shared gate (cloud-sync.js). Kept here as a defensive fallback only.
    const code = err && err.code;
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Wrong email or password';
    if (code === 'auth/user-not-found') return 'Account not found';
    if (code === 'auth/too-many-requests') return 'Too many attempts — try again later';
    if (code === 'auth/network-request-failed') return 'Network error';
    return err.message || 'Sign in failed';
  }

  // ---------- Messages ----------
  function pushMsg(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    $('msgs').appendChild(d);
    scrollBottom();
    return d;
  }
  function pushUser(text) { return pushMsg('user', text); }
  function pushBot(text) { return pushMsg('bot', text); }
  function pushSystem(text) { return pushMsg('system', text); }
  function pushError(text) { return pushMsg('error', '⚠ ' + text); }

  function pushLoading(text) {
    const d = document.createElement('div');
    d.className = 'msg bot';
    d.innerHTML = `<span class="loader"></span>  <span>${escapeHtml(text)}</span>`;
    $('msgs').appendChild(d);
    scrollBottom();
    return d;
  }

  function scrollBottom() {
    const c = $('msgs');
    c.scrollTop = c.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------- Composer ----------
  const input = $('input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  $('send').addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    if (!cachedState) { pushError('Data still loading, hang on'); return; }
    if (pendingPreview) {
      pushSystem('Your previous change is still pending — confirm or cancel it first');
      return;
    }

    pushUser(text);
    input.value = '';
    input.style.height = 'auto';
    $('send').disabled = true;
    const loadingEl = pushLoading('Parsing…');

    try {
      const today = new Date().toISOString().slice(0, 10);
      const r = await fetch('/api/parse', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          message: text,
          today,
          state: {
            units: (cachedState.units || []).map(u => ({
              key: u.key, id: u.id, zone: u.zone, status: u.status, date: u.date,
            })),
          },
        }),
      });
      loadingEl.remove();
      if (!r.ok) {
        const errBody = await r.text();
        pushError('Parse failed (' + r.status + '): ' + errBody.slice(0, 300));
        return;
      }
      const parsed = await r.json();
      handleParsed(parsed);
    } catch (err) {
      loadingEl.remove();
      pushError('Network error: ' + (err.message || err));
    } finally {
      $('send').disabled = false;
    }
  }

  // ---------- Preview / confirm ----------
  function handleParsed(parsed) {
    const hasUpdates = (parsed.unit_updates && parsed.unit_updates.length) || (parsed.log_entries && parsed.log_entries.length);

    if (parsed.needs_clarification && !hasUpdates) {
      pushBot('🤔 ' + parsed.needs_clarification);
      return;
    }
    if (!hasUpdates) {
      pushBot('I didn\'t catch that — could you rephrase? For example: "SF11A installed today"');
      return;
    }

    // Build preview
    const card = renderPreview(parsed);
    $('msgs').appendChild(card);
    scrollBottom();
    pendingPreview = { parsed, card };
  }

  function renderPreview(parsed) {
    const card = document.createElement('div');
    card.className = 'preview';

    // Build unit diff rows
    const unitRows = [];
    (parsed.unit_updates || []).forEach(up => {
      const cur = (cachedState.units || []).find(u => u.key === up.key);
      if (!cur) {
        unitRows.push(`
          <div class="diff-row">
            <span class="diff-key">${escapeHtml(up.key)}</span>
            <span class="diff-change" style="color: var(--bad);">⚠ Key not found in database</span>
          </div>`);
        return;
      }
      const changes = [];
      ['status', 'date', 'louver', 'note'].forEach(field => {
        if (up[field] !== undefined && up[field] !== cur[field]) {
          const oldV = cur[field] || '(empty)';
          const newV = up[field] || '(empty)';
          changes.push(`${field}: <span class="diff-old">${escapeHtml(oldV)}</span> <span class="diff-arrow">→</span> <span class="diff-new">${escapeHtml(newV)}</span>`);
        }
      });
      if (!changes.length) return; // nothing actually changed
      unitRows.push(`
        <div class="diff-row">
          <span class="diff-key">${escapeHtml(up.key)} <span style="color:var(--muted)">(${escapeHtml(cur.id)})</span></span>
          <span class="diff-change">${changes.join(' · ')}</span>
        </div>`);
    });

    const logRows = (parsed.log_entries || []).map(le => `
      <div class="diff-row">
        <span class="diff-key">+log ${escapeHtml(le.date)}</span>
        <span class="diff-change">[${escapeHtml(le.category)}] ${escapeHtml(le.content)}${le.planned ? ' <span style="color:var(--warn)">(planned)</span>' : ''}</span>
      </div>`).join('');

    card.innerHTML = `
      <div class="preview-head">📋 Preview changes${parsed.summary ? ' — ' + escapeHtml(parsed.summary) : ''}</div>
      <div class="preview-body">
        ${unitRows.length ? `<div class="preview-section"><h4>Units (${unitRows.length})</h4>${unitRows.join('')}</div>` : ''}
        ${logRows ? `<div class="preview-section"><h4>Log</h4>${logRows}</div>` : ''}
        ${parsed.needs_clarification ? `<div class="preview-section"><h4>Note</h4><div style="color:var(--warn);font-size:12px;">${escapeHtml(parsed.needs_clarification)}</div></div>` : ''}
      </div>
      <div class="preview-actions">
        ${isEditor ? `
          <button class="btn btn-cancel" data-action="cancel">Cancel</button>
          <button class="btn btn-confirm" data-action="confirm">Confirm</button>
        ` : `
          <span class="readonly-note">⚠ View-only mode — ask an editor to save these changes</span>
          <button class="btn btn-cancel" data-action="cancel">Dismiss</button>
        `}
      </div>
    `;
    card.querySelector('[data-action="cancel"]').addEventListener('click', () => cancelPreview(card));
    const confirmBtn = card.querySelector('[data-action="confirm"]');
    if (confirmBtn) confirmBtn.addEventListener('click', () => confirmPreview(card));
    return card;
  }

  function cancelPreview(card) {
    const wasPending = pendingPreview && pendingPreview.card === card;
    if (card.parentNode) card.remove();
    if (wasPending) pendingPreview = null;
    pushSystem('Cancelled');
  }

  async function confirmPreview(card) {
    if (!pendingPreview || pendingPreview.card !== card) return;
    const { parsed } = pendingPreview;
    const btns = card.querySelectorAll('.btn');
    btns.forEach(b => b.disabled = true);
    const confirmBtn = card.querySelector('[data-action="confirm"]');
    confirmBtn.innerHTML = '<span class="loader"></span> Saving…';

    try {
      // Build new state — fresh snapshot from server first to avoid clobbering
      const snap = await db.ref('state').once('value');
      const live = snap.val() || cachedState;
      const next = JSON.parse(JSON.stringify(live));

      // Apply unit updates
      const updated = [];
      (parsed.unit_updates || []).forEach(up => {
        const u = (next.units || []).find(x => x.key === up.key);
        if (!u) return;
        ['status', 'date', 'louver', 'note'].forEach(f => {
          if (up[f] !== undefined) u[f] = up[f];
        });
        updated.push(up.key);
      });

      // Append log entries
      if (!Array.isArray(next.log)) next.log = [];
      (parsed.log_entries || []).forEach(le => {
        next.log.push({
          date: le.date,
          category: le.category,
          content: le.content,
          ...(le.planned ? { planned: true } : {}),
        });
      });

      next.updatedAt = new Date().toISOString();

      // Push to Firebase /state
      const desc = parsed.summary || ('Chat: updated ' + updated.length + ' unit(s)');
      const payload = Object.assign({}, next, {
        _ts: firebase.database.ServerValue.TIMESTAMP,
        _by: currentUser.email,
        _desc: desc,
      });
      await db.ref('state').set(payload);
      // History
      const counts = { installed: 0, pending: 0, issue: 0 };
      (next.units || []).forEach(u => { if (counts[u.status] != null) counts[u.status]++; });
      await db.ref('history').push({
        ts: firebase.database.ServerValue.TIMESTAMP,
        user: currentUser.email,
        desc,
        snapshot: {
          units: next.units.length,
          installed: counts.installed,
          issues: counts.issue,
          log: (next.log || []).length,
        },
      });

      cachedState = next;
      card.querySelector('.preview-actions').innerHTML = '<span style="color:var(--good);font-size:13px;">✓ Saved</span>';
      pendingPreview = null;
      pushBot('✅ ' + desc + '\n\nThe main tracker will refresh automatically if it\'s open.');
    } catch (err) {
      console.error(err);
      btns.forEach(b => b.disabled = false);
      confirmBtn.textContent = 'Confirm';
      const code = err && err.code;
      let msg = err.message || String(err);
      if (code === 'PERMISSION_DENIED' || /permission/i.test(msg)) {
        msg = 'Your account has no write permission — ask an admin to add your email to /allowlist';
      }
      pushError('Save failed: ' + msg);
    }
  }

})();
</script>
</body>
</html>
